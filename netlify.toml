# Netlify config for the Unicef Games landing (static site, no build step).
# Deploys the repo as-is from the root.
[build]
  publish = "."

# These headers complement the root _headers file. They use extension-based
# wildcards so every game's Brotli-compressed Unity WebGL build is served with
# the right Content-Encoding / Content-Type.
#
# Builds use Compression Format = Brotli with Decompression Fallback = OFF, so
# the artifacts are raw Brotli streams named *.br. The browser MUST be told they
# are br-encoded so it decompresses them NATIVELY (off the main thread) and can
# stream-compile the wasm. Without this the browser can't decode them at all.
# (The previous *.unityweb fallback container forced slow JS main-thread
# decompression, which stalled loads on Android Chrome.)
#
# Build files are content-hashed/immutable per build, so cache them aggressively.

# Game data
[[headers]]
  for = "/game*/Build/*.data.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

# WebAssembly module
[[headers]]
  for = "/game*/Build/*.wasm.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# Unity framework JS
[[headers]]
  for = "/game*/Build/*.framework.js.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/javascript"
    Cache-Control = "public, max-age=31536000, immutable"

# Unity loader is plain JS (not pre-compressed); let Netlify gzip it on the fly.
[[headers]]
  for = "/game*/Build/*.loader.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
