# Netlify config for Unity 6 WebGL builds.
# Place this at the root you deploy to Netlify (same level as index.html),
# OR keep it at the repo root if Netlify's "publish directory" points to the build output.
#
# Purpose: serve Unity's pre-compressed files with the correct Content-Encoding
# so Android Chrome decompresses NATIVELY (fast) instead of downloading the raw,
# uncompressed payload. This is what itch.io effectively does for you automatically.
#
# Works for BOTH Brotli (.br) and Gzip (.gz) builds — only the files that actually
# exist get served, so you don't need to edit this when switching compression format.
#
# Assumes default Unity output layout: /Build/<files>. Adjust "for = " paths if your
# build folder is named differently or sits at a sub-path.

# ---------- Brotli (Compression Format = Brotli) ----------
[[headers]]
  for = "/Build/*.wasm.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/wasm"

[[headers]]
  for = "/Build/*.js.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/javascript"

[[headers]]
  for = "/Build/*.data.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/Build/*.symbols.json.br"
  [headers.values]
    Content-Encoding = "br"
    Content-Type = "application/octet-stream"

# ---------- Gzip (Compression Format = Gzip) ----------
[[headers]]
  for = "/Build/*.wasm.gz"
  [headers.values]
    Content-Encoding = "gzip"
    Content-Type = "application/wasm"

[[headers]]
  for = "/Build/*.js.gz"
  [headers.values]
    Content-Encoding = "gzip"
    Content-Type = "application/javascript"

[[headers]]
  for = "/Build/*.data.gz"
  [headers.values]
    Content-Encoding = "gzip"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/Build/*.symbols.json.gz"
  [headers.values]
    Content-Encoding = "gzip"
    Content-Type = "application/octet-stream"

# ---------- Long-lived caching for hashed/static build assets ----------
# Build output is immutable per deploy; cache aggressively so repeat visits are instant.
[[headers]]
  for = "/Build/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
