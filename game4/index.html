<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Unicef_Game_3</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2e3340;
      }

      /* Full-window canvas. Unity reports this size to Screen.width/height so the
         in-game CanvasScaler and camera adapt to any device aspect ratio. */
      #unity-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #2e3340;
        /* Avoid blurry scaling on high-DPI (Retina / iPad) displays. */
        image-rendering: auto;
      }

      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: none;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        color: #ffffff;
      }

      #unity-progress-bar-empty {
        width: 240px;
        height: 14px;
        margin: 12px auto 0 auto;
        background: rgba(255, 255, 255, 0.15);
        border-radius: 7px;
        overflow: hidden;
      }

      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #ffffff;
        transition: width 0.1s ease-out;
      }

      #unity-warning {
        position: absolute;
        left: 50%;
        top: 8px;
        transform: translateX(-50%);
        background: white;
        padding: 10px;
        display: none;
        font-family: Arial, Helvetica, sans-serif;
      }

      /* Branded loading screen shown while the Unity loader downloads,
         before the splash logos render on the canvas. */
      #loading-cover {
        position: fixed;
        inset: 0;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      #loading-cover img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div>Loading Unicef_Game_3…</div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="loading-cover">
        <img src="loadingscreen.png" alt="Loading" />
      </div>
    </div>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var loadingCover = document.querySelector("#loading-cover");

      function unityShowBanner(msg, type) {
        warningBanner.innerHTML = msg;
        warningBanner.style.display = "block";
        if (type === "error") {
          warningBanner.style.background = "red";
        } else {
          setTimeout(function () {
            warningBanner.style.display = "none";
          }, 5000);
        }
      }

      // Match the drawing buffer to the device pixel ratio so the game stays crisp
      // on Retina / high-DPI MacBook, iPad and mobile screens.
      function resizeCanvas() {
        var dpr = window.devicePixelRatio || 1;
        var rect = container.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        canvas.style.width = rect.width + "px";
        canvas.style.height = rect.height + "px";
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/game4.loader.js";
      var config = {
        dataUrl: buildUrl + "/game4.data.br",
        frameworkUrl: buildUrl + "/game4.framework.js.br",
        codeUrl: buildUrl + "/game4.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Unicef_Game_3",
        productVersion: "0.1.0",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: window.devicePixelRatio || 1,
        showBanner: unityShowBanner,
      };

      resizeCanvas();
      // Loading bar intentionally hidden so only the plain background shows
      // until the Unity splash logos render on the canvas.

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = 100 * progress + "%";
        })
          .then(function (unityInstance) {
            loadingBar.style.display = "none";
            loadingCover.style.display = "none";
            window.addEventListener("resize", resizeCanvas);
            window.addEventListener("orientationchange", function () {
              setTimeout(resizeCanvas, 200);
            });
          })
          .catch(function (message) {
            alert(message);
          });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
